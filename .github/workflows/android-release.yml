name: Android release (signed APK)

# Runs on version tags (v1.0.0) or manually. Needs these repository secrets:
#   ANDROID_KEYSTORE_BASE64  base64 of your release .jks keystore
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0"
        required: true

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See README > Release signing."
            exit 1
          fi

      - name: Decode keystore (kept outside the repo, deleted after)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build signed release APK
        working-directory: android
        env:
          GF_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          GF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GF_VERSION_CODE: ${{ github.run_number }}
          GF_VERSION_NAME: ${{ steps.v.outputs.version }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify and rename APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "Signed APK missing"; exit 1; }
          cp "$APK" "FinanceTracker-${{ steps.v.outputs.version }}.apk"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Finance Tracker ${{ steps.v.outputs.version }}
          files: FinanceTracker-${{ steps.v.outputs.version }}.apk
          generate_release_notes: true
