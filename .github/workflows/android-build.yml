name: Android build (debug APK)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # only used to refresh the "debug-latest" pre-release on pushes to main

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web tests (calculations, ledger, assistant, search, backup)
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A stable debug signing key, so each new debug APK installs as an update (no uninstall, no data loss).
      # Order: DEBUG_KEYSTORE_BASE64 secret if you add one → cached key → generate once and cache it.
      - name: Restore debug signing key
        id: dks
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: glass-finance-debug-keystore-v1

      - name: Prepare debug signing key
        env:
          DKS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DKS" ]; then echo "$DKS" | base64 -d > ~/.android/debug.keystore; echo "Using DEBUG_KEYSTORE_BASE64 secret";
          elif [ -f ~/.android/debug.keystore ]; then echo "Using cached debug key";
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated a new debug key"
          fi

      - name: Save debug signing key
        if: steps.dks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: glass-finance-debug-keystore-v1

      - name: Unit tests (notification parsers, reconciliation, categoriser)
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        env:
          GF_VERSION_CODE: ${{ github.run_number }}
          GF_VERSION_NAME: 1.0.${{ github.run_number }}-debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "APK missing"; exit 1; }
          ls -la "$APK"
          unzip -l "$APK" | grep -q "classes.dex" && echo "APK looks valid"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: glass-finance-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Phone-friendly download: the newest debug APK is attached to the "debug-latest" pre-release
      # (Releases page, no zip, no sign-in needed on a public repo).
      - name: Publish debug-latest pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GlassFinance-debug.apk
          gh release delete debug-latest --cleanup-tag -y || true
          gh release create debug-latest GlassFinance-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Glass Finance (latest debug build #${{ github.run_number }})" \
            --notes "Automatic debug build of ${GITHUB_SHA::7}. Download GlassFinance-debug.apk on your phone and open it to install."
